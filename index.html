<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one phone-width column. Title, then the game card (home / tutorial / dungeon / result), then the ranking.
   Look: 8-bit dungeon RPG. Black message boxes with white frames over a navy brick wall. One fixed dark look by choice. */
:root {
  --bg: #1a2760;
  --bg2: #16215a;
  --box: #05060d;
  --line: #eef2fa;
  --ink: #f4f6fb;
  --muted: #a3b2da;
  --accent: #ffd34d;
  --ok: #5fe08d;
  --ng: #ff6b6b;
  --heart: #e0343c;
  --heart-off: #2b3157;
  --font-dot: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--bg2) 2px, transparent 2px), linear-gradient(90deg, var(--bg2) 2px, transparent 2px);
  background-size: 36px 18px;
  color: var(--ink);
  font-family: var(--font-dot);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 14px;
}
.wrap { max-width: 520px; margin: 0 auto; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, p, ul { margin: 0; }
.ln { white-space: nowrap; }
h1 { font-size: 2rem; font-weight: 400; line-height: 1.25; color: var(--accent); text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 400; text-wrap: balance; }
.kicker { color: var(--muted); letter-spacing: 0.12em; font-size: 0.9rem; }
.lede { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }
header { display: flex; flex-direction: column; gap: 2px; }

.box { background: var(--box); border: 3px solid var(--line); border-radius: 4px; box-shadow: 0 0 0 2px var(--box); padding: 14px 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
#play { display: flex; flex-direction: column; gap: 12px; }

.hud { display: flex; justify-content: space-between; align-items: stretch; gap: 10px; }
.hud .box { padding: 8px 12px; line-height: 1.5; }
.hud .l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hud .r { text-align: center; display: flex; flex-direction: column; justify-content: center; white-space: nowrap; }
.hud .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
.hp { display: flex; align-items: center; gap: 8px; }
.hearts { display: flex; gap: 3px; }
.heart { width: 22px; height: 20px; }
.heart rect { fill: var(--heart); }
.heart.lost rect { fill: var(--heart-off); }

.scene { position: relative; border: 3px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--box); line-height: 0; }
.scene.tutbg { background: var(--box) url("tutorial-bg2.jpg") center bottom / cover no-repeat; }
.scene.chubg { background: var(--box) url("chu-bg.jpg") center 5% / cover no-repeat; }
.scene.chubg .enemy-wrap { bottom: 2%; } /* 中級: 台座の手前のカーペットに立たせる */
.scene.jobg { background: var(--box) url("jo-bg.jpg") center 62% / cover no-repeat; }
.scene.jobg .enemy-wrap { bottom: 6%; } /* 上級: ロッカー室の通路に立たせる */
.scene.rbg { background: var(--box) center bottom / cover no-repeat; }
.scene.rbg .enemy-wrap { bottom: 10%; }
.scene.nbg { background: var(--box) url("noodle-bg.jpg") center bottom / cover no-repeat; }
.scene.nbg .enemy-wrap { bottom: 9%; }
.pawa { text-align: center; color: #ffd34d; font-weight: bold; margin: 2px 0; }
.bossbar { position: absolute; z-index: 3; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 6px; padding: 3px 10px; background: rgba(20,8,8,.82); border: 2px solid #ffb347; line-height: 1; color: #ffd9a0; font-size: .8rem; pointer-events: none; }
.bossbar i { display: block; width: 18px; height: 12px; background: #ff8a2a; box-shadow: 0 0 6px #ff8a2a; }
.bossbar.wide { gap: 3px; padding: 3px 6px; } .bossbar.wide i { width: 9px; }
.bossbar.gauge { left: 6px; right: auto; padding: 3px 6px; gap: 5px; } .bossbar .gbar { width: 78px; height: 12px; background: #3a2a22; display: flex; } .bossbar.gauge .gbar i { width: auto; height: 100%; background: linear-gradient(90deg,#2a8cff,#9fe0ff); box-shadow: 0 0 6px #5ac0ff; transition: width .4s; } .bossbar .gnum { font-size: .68rem; white-space: nowrap; }
.bossbar i.off { background: #3a2a22; box-shadow: none; }
.ov { position: absolute; z-index: 2; pointer-events: none; line-height: 1.4; font-size: 0.82rem; padding: 3px 8px; border-width: 2px; max-width: 46%; }
.ov.tl { top: 6px; left: 6px; }
.ov.tr { top: 6px; right: 6px; }
.ov.bl { bottom: 6px; left: 6px; padding: 6px 10px; pointer-events: auto; cursor: pointer; font: inherit; font-size: 0.82rem; color: var(--ink); background: var(--box); }
.ov.bl.ask { border-color: var(--ng, #ff6b6b); }
.ov.br { bottom: 6px; right: 6px; display: flex; align-items: center; gap: 6px; }
.ov .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov .heart { width: 16px; height: 14px; }
.ov .hearts { gap: 2px; }
.enemy-wrap { position: absolute; left: 50%; bottom: 36%; transform: translateX(-50%); transform-origin: 50% 100%; pointer-events: none; }
.enemy-wrap.i0 { animation: idle-squash 1.1s ease-in-out infinite; }
.enemy-wrap.i1 { animation: idle-float 1.8s ease-in-out infinite; }
.enemy-wrap.i2 { animation: idle-sway 1s ease-in-out infinite; }
.enemy-wrap.i3 { animation: idle-hop 0.8s ease-in-out infinite; }
.enemy-wrap.i4 { animation: idle-rumble 0.3s linear infinite; }
.enemy-wrap.i5 { animation: idle-pulse 0.9s ease-in-out infinite; }
.enemy-wrap.i6 { animation: idle-wobble 1.4s ease-in-out infinite; }
.enemy-wrap.i7 { animation: idle-stomp 1.3s ease-in infinite; }
.enemy-wrap.i8 { animation: idle-tall 2.2s ease-in-out infinite; }
.enemy-wrap.i9 { animation: idle-sway 1.2s ease-in-out infinite; }
.enemy-wrap.i13 { animation: idle-stomp 1.5s ease-in infinite; }
.enemy-wrap.i14 { animation: idle-float 2s ease-in-out infinite; }
.enemy-wrap.i15 { animation: idle-wobble 1.2s ease-in-out infinite; }
.enemy-wrap.i16 { animation: idle-pulse 1s ease-in-out infinite; }
.enemy-wrap.i17 { animation: idle-hop 0.9s ease-in-out infinite; }
.enemy-wrap.i18 { animation: idle-float 1.4s ease-in-out infinite; }
.enemy-wrap.i19 { animation: idle-sway 1.6s ease-in-out infinite; }
.enemy-wrap.i21 { animation: idle-tall 1.8s ease-in-out infinite; }
.enemy-wrap.i32 { animation: idle-wobble 1.2s ease-in-out infinite; }
.enemy-wrap.i33 { animation: idle-buzz 0.7s ease-in-out infinite; }
.enemy-wrap.i34 { animation: idle-hop 1.3s ease-in-out infinite; }
.enemy-wrap.i35 { animation: idle-hop 1.1s ease-in-out infinite; }
.enemy-wrap.i36 { animation: idle-wobble 1.3s ease-in-out infinite; }
.enemy-wrap.i39 { --gc: rgba(190, 70, 255, .85); animation: idle-float 1.8s ease-in-out infinite, glowpulse 1.4s ease-in-out infinite; } /* 回廊ボス: 白骨ヌードル */
.enemy-wrap.i37 { animation: idle-float 1.4s ease-in-out infinite; }
.enemy-wrap.i38 { animation: idle-squash 1.2s ease-in-out infinite; }
.enemy-wrap.i40 { --gc: rgba(80, 190, 255, .9); animation: idle-float 2.2s ease-in-out infinite, glowpulse 1.1s ease-in-out infinite; }
.enemy-wrap.i25 { animation: idle-stomp 1.4s ease-in infinite; }
.enemy-wrap.i26 { animation: idle-wobble 1.1s ease-in-out infinite; }
.enemy-wrap.i27 { animation: idle-sway 1.5s ease-in-out infinite; }
.enemy-wrap.i24 { animation: idle-sway 1.3s ease-in-out infinite; }
.enemy-wrap.i22 { animation: idle-rumble 0.35s linear infinite; }
.enemy-wrap.i23 { animation: idle-buzz 0.6s ease-in-out infinite; }
.enemy-wrap.i20 { animation: idle-float 1.5s ease-in-out infinite; }
.enemy-wrap.i10 { animation: idle-sway 1.1s ease-in-out infinite; }
.enemy-wrap.i11 { animation: idle-squash 0.7s ease-in-out infinite; }
.enemy-wrap.i12 { animation: idle-pulse 1.6s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,140,40,.55)); }
/* 特別な敵(ボス・裏ボス・イベント・激レア)は、色つきの光をまとう。中級ボス(i12)のオレンジの光と同じ仲間 */
@keyframes glowpulse { 0%, 100% { filter: drop-shadow(0 0 3px var(--gc)) drop-shadow(0 0 8px var(--gc)); } 50% { filter: drop-shadow(0 0 5px var(--gc)) drop-shadow(0 0 18px var(--gc)); } }
.enemy-wrap.i9 { --gc: rgba(255, 60, 60, .75); animation: idle-sway 1.2s ease-in-out infinite, glowpulse 1.1s ease-in-out infinite; } /* 裏ボス: 赤 */
.enemy-wrap.i10 { --gc: rgba(170, 90, 255, .7); animation: idle-sway 1.1s ease-in-out infinite, glowpulse 1.4s ease-in-out infinite; } /* イタズラおじさん: 紫 */
.enemy-wrap.i11 { --gc: rgba(255, 110, 170, .7); animation: idle-squash 0.7s ease-in-out infinite, glowpulse 1.4s ease-in-out infinite; } /* エビサンダル: ピンク */
.enemy-wrap.i28 { --gc: rgba(255, 70, 160, .8); animation: idle-sway 1.4s ease-in-out infinite, glowpulse 1.2s ease-in-out infinite; } /* 回廊ボス(覚醒): ピンク */
.enemy-wrap.i29 { --gc: rgba(230, 60, 255, .85); animation: idle-sway 1.2s ease-in-out infinite, glowpulse 1s ease-in-out infinite; } /* 回廊ボス(最終形態): 赤紫 */
.enemy-wrap.i30 { --gc: rgba(255, 40, 120, .9); animation: idle-sway 1.1s ease-in-out infinite, glowpulse .9s ease-in-out infinite; } /* 回廊ボス(真・最終形態): 濃いピンク */
.enemy-wrap.i31 { --gc: rgba(255, 30, 140, 1); animation: idle-sway 1s ease-in-out infinite, glowpulse .8s ease-in-out infinite; } /* 回廊ボス(完全体): 濃いピンク */
.enemy-wrap.i19 { --gc: rgba(255, 210, 60, .8); animation: idle-sway 1.6s ease-in-out infinite, glowpulse 1.3s ease-in-out infinite; } /* ラスボス: 金 */
.enemy-wrap.i20 { --gc: rgba(110, 230, 255, .8); animation: idle-float 1.5s ease-in-out infinite, glowpulse 1s ease-in-out infinite; } /* 激レア: 水色 */
.enemy-wrap.i24 { --gc: rgba(70, 150, 255, .8); animation: idle-sway 1.3s ease-in-out infinite, glowpulse 1.3s ease-in-out infinite; } /* 上級ラスボス: 青 */
.enemy-wrap.i12 { --gc: rgba(255, 140, 40, .85); }
@keyframes halo { 0% { opacity: .35; } 100% { opacity: .85; } }
.zk-pic .enemy-wrap::before { content: ""; position: absolute; inset: -18% -22%; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, var(--gc, transparent), transparent 78%); animation: halo 1.5s ease-in-out infinite alternate; } /* 図鑑: 特別な敵の後ろに、色つきの光の輪 */
/* 分析画面 */
.st-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.st-tile { border: 2px solid var(--muted); border-radius: 4px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.st-tile small { color: var(--muted); font-size: 0.72rem; }
.st-tile b { font-size: 1.25rem; font-weight: 400; }
.st-tabs { display: flex; gap: 6px; }
.st-tab { flex: 1; font: inherit; font-size: 1rem; color: var(--ink); background: var(--box); border: 2px solid var(--muted); border-radius: 4px; padding: 10px 6px; cursor: pointer; }
.st-tab.on { border-color: var(--accent); color: var(--accent); background: var(--bg2); }
.st-row { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-bottom: 1px solid #26305f; }
.st-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.st-label { font-size: 1rem; }
.st-pc { font-size: 1.15rem; }
.st-bar { height: 10px; background: var(--heart-off); border-radius: 2px; overflow: hidden; }
.st-bar i { display: block; height: 100%; }
.st-pc.ok, .st-big.ok, .st-tile b.ok { color: var(--ok); } .st-pc.mid, .st-big.mid, .st-tile b.mid { color: var(--accent); } .st-pc.ng, .st-big.ng, .st-tile b.ng { color: var(--ng); }
.st-bar i.ok { background: var(--ok); } .st-bar i.mid { background: var(--accent); } .st-bar i.ng { background: var(--ng); }
.st-q { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--muted); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.st-big { flex: none; width: 58px; text-align: center; display: flex; flex-direction: column; line-height: 1.2; }
.st-big span { font-size: 1.3rem; }
.st-big small { font-size: 0.7rem; color: var(--muted); }
.st-qbody { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.st-qtext { font-size: 0.95rem; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st-q.open .st-qtext { display: block; }
.st-filter { display: flex; align-items: center; gap: 8px; }
.st-filter select, .st select { font: inherit; }
.st-h { font-size: 1rem; color: var(--accent); font-weight: 400; margin-top: 6px; }
.evbanner { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 4; width: max-content; max-width: 92%; text-align: center; line-height: 1.4; font-size: 0.92rem; color: #fff; background: rgba(5,6,13,.88); border: 2px solid var(--line); border-radius: 4px; padding: 3px 10px; pointer-events: none; }
@keyframes idle-buzz { 0%, 100% { transform: translateX(-50%) translateY(-7%) rotate(-2deg); } 25% { transform: translateX(-52%) translateY(-2%) rotate(1deg); } 50% { transform: translateX(-49%) translateY(-9%) rotate(2deg); } 75% { transform: translateX(-51.5%) translateY(-3%) rotate(-1deg); } }
@keyframes idle-rumble { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(-51.3%); } 75% { transform: translateX(-48.7%); } }
@keyframes idle-pulse { 0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); } 50% { transform: translateX(-50%) scale(1.08) rotate(-2.5deg); } }
@keyframes idle-wobble { 0%, 100% { transform: translateX(-50%) rotate(-3deg) scale(1.02, 0.97); } 50% { transform: translateX(-50%) rotate(3deg) scale(0.98, 1.03); } }
@keyframes idle-stomp { 0%, 60%, 100% { transform: translateX(-50%) translateY(0) scale(1, 1); } 30% { transform: translateX(-50%) translateY(-6%) rotate(-1.5deg); } 45% { transform: translateX(-50%) translateY(0) scale(1.03, 0.95); } }
@keyframes idle-tall { 0%, 100% { transform: translateX(-50%) rotate(-2deg); } 50% { transform: translateX(-50%) rotate(2deg); } }
.enemy { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
/* 敵ごとの待機の動き: 一つ目=ぷるぷる / しま模様=ふわふわ / 人=ゆらゆら / 犬=ぴょんぴょん */
@keyframes idle-squash { 0%, 100% { transform: translateX(-50%) scale(1, 1); } 50% { transform: translateX(-50%) scale(1.07, 0.92); } }
@keyframes idle-float { 0%, 100% { transform: translateX(-50%) translateY(-6%) rotate(-2.5deg); } 50% { transform: translateX(-50%) translateY(0) rotate(2.5deg); } }
@keyframes idle-sway { 0%, 100% { transform: translateX(-50%) rotate(-2deg) translateY(0); } 25% { transform: translateX(-50%) rotate(0deg) translateY(-2%); } 50% { transform: translateX(-50%) rotate(2deg) translateY(0); } 75% { transform: translateX(-50%) rotate(0deg) translateY(-2%); } }
@keyframes idle-hop { 0%, 100% { transform: translateX(-50%) translateY(0) scale(1.04, 0.95); } 45% { transform: translateX(-50%) translateY(-9%) scale(0.97, 1.04); } 90% { transform: translateX(-50%) translateY(0) scale(1.04, 0.95); } }
#scene { width: 100%; height: auto; aspect-ratio: 160 / 112; image-rendering: pixelated; display: block; }
.scene.hit { animation: shake 0.4s steps(6) 0.38s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

.q { white-space: pre-line; font-size: 1.2rem; line-height: 1.7; text-wrap: balance; overflow-wrap: anywhere; }
.qno { color: var(--muted); font-size: 0.85rem; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: baseline; gap: 14px; width: 100%; text-align: left; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--box); border: 3px solid var(--line); border-radius: 4px; padding: 11px 14px; min-height: 52px; cursor: pointer; }
.opt .lab { color: var(--accent); flex: none; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }

.btn { font: inherit; font-size: 1.05rem; cursor: pointer; background: var(--accent); color: #1b1500; border: 3px solid var(--line); border-radius: 4px; padding: 10px 16px; min-height: 48px; }

.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }

.field { display: flex; flex-direction: column; gap: 6px; }

.field textarea { resize: vertical; }
.rules { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
.rules li::marker { color: var(--accent); }
.note { color: var(--muted); font-size: 0.85rem; }
.locked { color: var(--muted); font-size: 0.85rem; }

.bigstat { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
.bigstat .n { font-size: 3.4rem; line-height: 1; color: var(--accent); }
.verdict.clear { color: var(--ok); }
.verdict.over { color: var(--ng); }
.rainbow { background: linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe14d,#3ddc84,#3bb2ff,#8a5cff,#ff3bd4,#ff3b3b); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: rb 2.5s linear infinite; font-weight: bold; }

.top-home { width: 100%; margin-bottom: 12px; }

function poolFor(mode) {

  const ex = (g) => extraQ.filter((x) => x.genre === g).map((x) => ({ id: x.id, q: x.q, c: x.c, a: x.a, e: x.e }));

  const enough = (arr, n) => arr.length >= n;
  if (mode === "chu") return enough(ex("chu"), MODES.chu.len) ? ex("chu") : BASE.chu.concat(ex("chu"));
  if (mode === "jo") return enough(ex("jo"), MODES.jo.len) ? ex("jo") : BASE.jo.concat(ex("jo"));

function buildRunQuestions(mode) { // 問題が足りないときは、もう一巡させて必要な数にそろえる(同じ問題が続けて出ないように)
  if (mode === "review") return shuffle(reviewList()).slice(0, MODES.review.len);
  const n = MODES[mode].len, pool = poolFor(mode);
  let out = [];
  while (pool.length && out.length < n) {
    const b = shuffle(pool.slice());
    if (out.length && b.length > 1 && b[0].q === out[out.length - 1].q) b.push(b.shift());
    out = out.concat(b);
  }
  out = out.slice(0, n);
  if (mode === "jo" && n > 0) out[n - 1] = JO_FINAL; // 上級の最後は、いつもこの問題

}

// 問題を n 問ふやす(まだ出ていない問題を優先。足りなければ、直近を除いてもう一度使う)
function extendQs(n) {
  const pool = poolFor(G.mode);
  const used = new Set(G.qs.map((x) => x.q));
  const recent = new Set(G.qs.slice(-10).map((x) => x.q));
  let add = shuffle(pool.filter((x) => !used.has(x.q)));
  if (add.length < n) add = add.concat(shuffle(pool.filter((x) => used.has(x.q) && !recent.has(x.q))));
  if (add.length < n) add = add.concat(shuffle(pool.slice()));
  G.qs = G.qs.concat(add.slice(0, n));
}

async function saveRun(run) {
  if (!canSave()) return;
  try {
    const ref = db.doc("results/" + uid);
    const snap = await ref.get();
    const prev = snap.exists ? snap.data() : {};
    const rc = run.correct - (run.nodCorrect || 0), ra = run.answered - (run.nodAnswered || 0); // 裏ボス戦の問題は、レートと正答率に数えない
    const answered = (prev.answered || 0) + ra;
    const correct = (prev.correct || 0) + rc;
    const best = Math.max(prev.best || 0, rc);
    const runRating = rc * RATE_PER_CORRECT + corrBonus(run), rating = Math.max(ratingOf(prev), runRating); // 無限回廊ボーナスは、その回のレートに足す
    const tier = Math.max(tierOf(prev), runTier(run));
    localTier = Math.max(localTier, tier);
    await ref.set({
      name: myName,
      correct: correct,
      answered: answered,
      rounds: (prev.rounds || 0) + 1,
      clears: (prev.clears || 0) + (run.cleared ? 1 : 0),
      best: best,
      titleTier: tier ? tier + TIER_OFF : 0,
      logo: hasLogo(prev) || !!prev.logo,
      bestStreak: Math.max(prev.bestStreak || 0, run.maxStreak),
      rate: answered ? correct / answered : 0,
      rating: rating,
      updatedAt: Date.now()
    });
    run.total = rating;
    run.newBest = runRating > ratingOf(prev);
    run.save = "saved";
  } catch (e) {
    run.save = "failed";
  }
  if (G === run && G.state === "end") render();
}

  await firebase.auth().currentUser.linkWithCredential(cred);
}
async function acctLogin(name, pw) {
  await firebase.auth().signInWithEmailAndPassword(acctEmail(name), pw);
  clearLocalForSwitch(); location.reload();
}
// ユーザー名・合言葉(・確認)の入力欄と、「作る」「ログイン」の部品
function acctFields(withConfirm, nameVal) {
  const mk = (label, id, type, ph, max) => {
    const f = el("div", "field"); const l = el("label", null, label); l.htmlFor = id;
    const i = document.createElement("input"); i.id = id; i.type = type; i.maxLength = max || 40; i.autocomplete = "off"; i.autocapitalize = "none"; if (ph) i.placeholder = ph;
    f.append(l, i); return [f, i];
  };
  const [f1, u] = mk("ユーザー名(ランキングに表示されます)", "acid", "text", "例: たろう", 12);
  if (nameVal) u.value = nameVal;
  const [f2, pw] = mk("合言葉(6文字以上)", "acpw", "password");
  const els = [f1, f2]; let pw2 = null;
  if (withConfirm) { const [f3, i3] = mk("合言葉(もう一度)", "acpw2", "password"); els.push(f3); pw2 = i3; }
  return { els, u, pw, pw2 };
}
function acctCheck(F, say) { // 入力の確認。問題があれば、メッセージを出して false
  if (!userOk(F.u.value)) { say("ユーザー名は、1〜12文字で入れてください。", true); return false; }
  if (F.pw.value.length < 6) { say("合言葉は、6文字以上にしてください。", true); return false; }
  if (F.pw2 && F.pw.value !== F.pw2.value) { say("合言葉が、2回で一致しません。", true); return false; }
  return true;
}
async function initFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) return false;
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base + "firebase-app-compat.js");
  await loadScript(base + "firebase-auth-compat.js");
  await loadScript(base + "firebase-firestore-compat.js");
  firebase.initializeApp(cfg);
  // すでにログインずみ(アカウント・匿名)なら、そのまま使う。signInAnonymously を先に呼ぶと、アカウントのログインが外れてしまう
  let user = await new Promise((res) => { const un = firebase.auth().onAuthStateChanged((u) => { un(); res(u); }); });
  if (!user) user = (await firebase.auth().signInAnonymously()).user;
  uid = user.uid; canWrite = true; db = firebase.firestore(); STANDALONE = true;
  try { gmOK = (await db.doc("admins/" + uid).get()).exists; } catch (e) { gmOK = false; } // ゲームマスターに登録ずみか
  return true;
}
async function init() {
  const c = window.claude;
  rebuildQ();
  if (!c || !c.use) { try { await initFirebase(); } catch (e) { db = null; } }
  else try {
    const got = await Promise.all([c.use("db"), c.use("user")]);
    db = got[0];
    const user = got[1];
    if (user) {
      uid = await user.id();
      canWrite = await user.can("data.write");
    }
  } catch (e) { db = null; }
  if (!G) render();
  if (!db) { boardState = "offline"; renderBoard(); return; }
  if (uid) {
    try {
      db.doc("data/users/" + uid + "/profile").get().then((s) => {
        if (!s.exists) { if (myName || tutorialDone || prog.chu || prog.jo) saveProfile(); return; }
        const d = s.data();
        let changed = false;
        if (d.tutorialDone && !tutorialDone) { tutorialDone = true; changed = true; }
        if (d.chu && !prog.chu) { prog.chu = true; changed = true; }
        if (d.jo && !prog.jo) { prog.jo = true; changed = true; }
        if (d.name && !myName) { myName = String(d.name).slice(0, 12); changed = true; }
        if (Array.isArray(d.seen)) { d.seen.forEach((x) => { if (Number.isInteger(x) && !seen.has(x)) { seen.add(x); changed = true; } }); }
        if (Array.isArray(d.missed)) { d.missed.forEach((x) => { if (typeof x === "string" && !missed.has(x)) { missed.add(x); changed = true; } }); }
        if (changed) {
          try {
            localStorage.setItem("quiz-missed", JSON.stringify(Array.from(missed)));
            localStorage.setItem("quiz-name", myName);
            localStorage.setItem("quiz-tut", tutorialDone ? "1" : "0");
            localStorage.setItem("quiz-prog", JSON.stringify(prog));
            localStorage.setItem("quiz-seen", JSON.stringify(Array.from(seen)));
          } catch (e) {}
          if (!G && view === "home") render();
        }
      }).catch(() => {});
    } catch (e) {}
  }
  db.collection("results").limit(500).onSnapshot(
    (snap) => {
      rows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      boardState = "ready";
      renderBoard();
      checkTitleReset();
    },
    () => { boardState = "error"; renderBoard(); }
  );
  db.collection("enemies").limit(100).onSnapshot(
    (snap) => {
      const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); }); enemyInfo = m;
      if (!G && view === "zukan" && zkEdit < 0) render();
    },
    () => {}
  );
  db.collection("questions").limit(500).onSnapshot(
    (snap) => {
      fsQ = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      rebuildQ();
      if (!G && view === "qadd") renderQList();
    },
    () => {}
  );
}
enterGame();
